[tox]
requires = tox>=4
envlist = py312, lint

[testenv:format]
description = format code with black
skip_install = true
deps =
    black
commands =
    black usr/lib/renametoix

[testenv:lint]
description = lint code with ruff
skip_install = true
deps =
    ruff
commands =
    ruff check usr/lib/renametoix

[testenv:clean]
description = removes temporary folders
skip_install = true
commands =
    python tools/prepare.py clean

[testenv:test-py312]
description = run pytest
setenv =
    PYTHONPATH = {toxinidir}/src
deps =
    pytest
commands =
    pytest

[testenv:build-package]
description = build package
allowlist_externals = tox
skip_install = true
deps =
    build
commands =
    tox -e format
    tox -e lint
    python tools/prepare.py prepare-pip
    python -m build

[testenv:publish-dev]
description = publish to test.pypi.org
skip_install = true
allowlist_externals = tox
deps =
    build
    twine
commands =
    tox -e build-package
    python -m twine upload --skip-existing --config-file "{env:HOME}/.pypirc-dev" dist/*

[testenv:publish]
description = publish to pypi.org
skip_install = true
allowlist_externals = tox
deps =
    build
    twine
commands =
    tox -e build-package
    python -m twine upload --skip-existing --config-file "{env:HOME}/.pypirc" dist/*
